name: Release

# Tag-triggered release: a `v*` tag publishes the all-in-one GHCR image
# (daemon + web static hosting) and attaches the superlive component packages
# (standalone / connect) to the GitHub Release — both forms are built on all
# three shell platforms (linux-x86_64 / macos-aarch64 / windows-x86_64), six
# zips per release, asset names carrying the platform suffix.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # vX.Y.Z -> X.Y.Z for the image tag
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The gha cache backend requires a docker-container driver builder —
      # the runner's default docker driver cannot export cache.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = arm64 runner, windows-latest = x64 runner — the
        # matrix matches the superlive shell's updater platform keys.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The packaging scripts are bash; GitHub windows runners ship Git
        # Bash, so the same scripts run on all three platforms unchanged.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # The scripts shell out to zip/unzip for packaging and the in-package
      # proofs; Git Bash on windows runners ships neither — install both.
      - name: Ensure zip tools (windows)
        if: runner.os == 'Windows'
        run: choco install zip unzip --no-progress -y
      # The packaging scripts run the ui build through `npm run build`
      # without installing dependencies; node_modules must be in place first
      # (frozen install, reproducible against the committed lockfile)
      - name: Install frontend deps
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Package standalone component
        run: scripts/package-standalone.sh
      - name: Package connect component
        run: scripts/package-connect.sh
      - name: Release notes path
        id: notes
        run: |
          f="docs/release-notes/${GITHUB_REF_NAME#v}.md"
          [ -f "$f" ] || : > "$f"   # missing notes ship empty rather than fail the release
          echo "path=$f" >> "$GITHUB_OUTPUT"
      # Version manifests for the shell's component update check: each form
      # (standalone/connect) gets one, referenced by the package manifests'
      # update.manifest_url through the version-less latest/download redirect
      - name: Generate version manifests
        run: |
          python3 - "${GITHUB_REF_NAME}" "${{ steps.notes.outputs.path }}" <<'PY'
          import json, sys
          from pathlib import Path

          tag, notes_path = sys.argv[1], sys.argv[2]
          ver = tag.lstrip("v")
          notes = Path(notes_path).read_text(encoding="utf-8")
          repo = "drodreo/xatodo"
          platforms = ["linux-x86_64", "macos-aarch64", "windows-x86_64"]

          for form in ("standalone", "connect"):
              manifest = {
                  "version": ver,
                  "notes": notes,
                  "packages": {
                      p: f"https://github.com/{repo}/releases/download/{tag}/xatodo-{form}-{ver}-{p}.zip"
                      for p in platforms
                  },
              }
              out = Path(f"dist/{form}-latest.json")
              out.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(f"wrote {out}")
          PY
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xatodo-standalone-*.zip
            dist/xatodo-connect-*.zip
            dist/standalone-latest.json
            dist/connect-latest.json
          body_path: ${{ steps.notes.outputs.path }}
