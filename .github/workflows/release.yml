name: Release

# Tag-triggered release: a `v*` tag publishes the all-in-one GHCR image
# (daemon + web static hosting) and attaches the two superlive component
# packages (standalone / connect) to the GitHub Release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # vX.Y.Z -> X.Y.Z for the image tag
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # The packaging script runs the ui build through `npm run build`
      # without installing dependencies; node_modules must be in place first
      # (frozen install, reproducible against the committed lockfile)
      - name: Install frontend deps
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Package standalone component
        run: scripts/package-standalone.sh
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/xatodo-standalone-*.zip

  package-connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Package connect component
        run: scripts/package-connect.sh
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/xatodo-connect-*.zip
