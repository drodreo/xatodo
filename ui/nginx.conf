# XaTodo web static serving: SPA history fallback + long-lived static caching
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output: immutable, cache forever
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Entry page is never cached, so a release takes effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: frontend routes always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
